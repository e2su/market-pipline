# The whole pipeline on one server, running 24/7:
#   docker compose -f docker-compose.prod.yml up -d --build
# Every service restarts on its own after a crash or a reboot. See DEPLOY.md.

x-logging: &logging
  # Keep container logs from slowly filling the disk.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  build: .
  image: market-pipeline-app
  restart: unless-stopped
  logging: *logging
  env_file: .env
  environment:
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    WAREHOUSE: postgres
    POSTGRES_HOST: postgres

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    restart: unless-stopped
    logging: *logging
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms256M"
    # Kafka and ZooKeeper must keep their data together: if only Kafka's survives,
    # it refuses to start ("cluster ID mismatch").
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    restart: unless-stopped
    logging: *logging
    depends_on:
      - zookeeper
    # No ports published: only the other containers talk to Kafka.
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Spark checkpoints its progress to S3, so Kafka only needs a day of history.
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: confluentinc/cp-kafka:7.4.0
    logging: *logging
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic crypto-prices --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic stock-prices --partitions 1 --replication-factor 1

  postgres:
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-market}
      POSTGRES_USER: ${POSTGRES_USER:-market}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  binance-producer:
    <<: *app
    command: python -m producers.binance_producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  stock-producer:
    <<: *app
    command: python -m producers.stock_producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  stream-processor:
    <<: *app
    command: python -m processing.stream_processor
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    volumes:
      # Cache the Spark jars it downloads, so restarts are quick.
      - ivy-cache:/root/.ivy2

  loader:
    <<: *app
    command: python -m processing.redshift_loader
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    <<: *app
    command: streamlit run dashboard/app.py --server.address=0.0.0.0 --server.port=8501 --server.headless=true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8501:8501"

volumes:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  postgres-data:
  ivy-cache:
